<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Valkyrindle</title>

<!--
  Using different fonts? Swap this Google Fonts link for your own,
  then update CONFIG.fonts below to match the family names.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ================================================================
     STRUCTURAL CSS ONLY — you shouldn't need to touch this file's
     <style> block at all. Every color, font, spacing, and background
     value below is a CSS variable (var(--something)), and ALL of
     those variables are set from the CONFIG object in <script> at
     the bottom of this file. Go edit CONFIG, not this CSS.
     ================================================================ */
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg-style);
    color:var(--text);
    font-family: var(--font-body);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 80px;
  }

  /* Semi-transparent "glass" panel that sits between the background
     image and all the game content, so text stays readable. */
  #page-panel{
    background: var(--overlay-color);
    backdrop-filter: blur(var(--overlay-blur));
    -webkit-backdrop-filter: blur(var(--overlay-blur));
    border-radius: var(--overlay-radius);
    padding: var(--overlay-padding);
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width: calc(var(--max-width) + 80px);
  }

  h1{
    font-family: var(--font-display);
    font-weight:700;
    letter-spacing:0.08em;
    font-size:2.1rem;
    text-transform:uppercase;
    margin:0 0 4px;
    background:linear-gradient(90deg,var(--accent-1),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-align:center;
  }
  .subtitle{
    color:var(--text-dim);
    font-size:0.92rem;
    margin-bottom:20px;
    text-align:center;
    max-width:560px;
    line-height:1.5;
  }

  /* ---- Tabs (Daily / Endless) ---- */
  #mode-tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
  }
  .tab-btn{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:10px 22px;
    border-radius:var(--radius);
    font-family: var(--font-display);
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    font-size:0.85rem;
    cursor:pointer;
  }
  .tab-btn:hover:not(.active){ border-color:var(--accent-1); color:var(--accent-1); }
  .tab-btn.active{ background:var(--accent-1); color:var(--bg); border-color:var(--accent-1); }

  .scan-line{
    width:100%;
    max-width:var(--max-width);
    height:1px;
    background:linear-gradient(90deg, transparent, var(--accent-1), transparent);
    margin-bottom:24px;
    opacity:0.6;
  }

  .mode-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }

  .guess-form{
    display:flex;
    gap:8px;
    width:100%;
    max-width:420px;
    position:relative;
  }
  .guess-input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:12px 14px;
    border-radius:var(--radius);
    font-size:1rem;
    font-family: var(--font-body);
    outline:none;
  }
  .guess-input:focus{border-color:var(--accent-1);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent-1) 20%, transparent);}
  .guess-form button{
    background:var(--accent-1);
    color:var(--bg);
    border:none;
    border-radius:var(--radius);
    padding:0 20px;
    font-family: var(--font-display);
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    cursor:pointer;
    font-size:0.95rem;
  }
  .guess-form button:hover{ filter:brightness(1.15); }
  .autocomplete{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:76px;
    background:var(--panel-alt);
    border:1px solid var(--line);
    border-radius:var(--radius);
    max-height:260px;
    overflow-y:auto;
    z-index:10;
    display:none;
  }
  .autocomplete-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 14px;
    cursor:pointer;
    font-size:0.92rem;
    border-bottom:1px solid var(--line);
  }
  .autocomplete-item:last-child{border-bottom:none;}
  .autocomplete-item:hover{background:var(--panel);color:var(--accent-1);}

  .portrait{
    border-radius: var(--portrait-radius);
    background: var(--panel-alt);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--font-display);
    font-weight:700;
    color:var(--text-dim);
    overflow:hidden;
    flex-shrink:0;
  }
  .portrait img{ width:100%; height:100%; object-fit:cover; display:block; }
  .portrait-dropdown{ width: var(--portrait-size-dropdown); height: var(--portrait-size-dropdown); font-size:0.65rem; }
  .portrait-board{ width: var(--portrait-size-board); height: var(--portrait-size-board); font-size:0.8rem; }

  .board-wrap{
    width:100%;
    max-width:var(--max-width);
    margin-top:28px;
    overflow-x:auto;
  }
  .board{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:520px;
  }
  .header-row, .guess-row{ display:grid; gap:8px; }
  .header-row div{
    font-family: var(--font-display);
    font-size:0.75rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-dim);
    text-align:center;
    padding-bottom:4px;
  }
  .cell{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 6px;
    text-align:center;
    font-size:0.88rem;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: var(--card-min-height);
    animation: flip 0.5s ease;
  }
  @keyframes flip{
    0%{transform:rotateX(90deg);opacity:0;}
    100%{transform:rotateX(0deg);opacity:1;}
  }
  .cell.name{
    font-family: var(--font-display);
    font-weight:700;
    font-size:0.85rem;
    flex-direction:column;
    gap:6px;
    padding:10px 6px;
  }
  .match{background:color-mix(in srgb, var(--accent-2) 18%, transparent);border-color:var(--accent-2);color:var(--accent-2);}
  .close{background:color-mix(in srgb, var(--accent-1) 14%, transparent);border-color:var(--accent-1);color:var(--accent-1);}
  .no-match{background:color-mix(in srgb, var(--danger) 8%, transparent);border-color:var(--line);color:var(--text-dim);}

  .win-banner{
    margin-top:24px;
    padding:16px 20px;
    background:linear-gradient(90deg, color-mix(in srgb, var(--accent-2) 15%, transparent), color-mix(in srgb, var(--accent-1) 10%, transparent));
    border:1px solid var(--accent-2);
    border-radius:8px;
    text-align:center;
    display:none;
    max-width:520px;
    font-family: var(--font-display);
    font-size:1.1rem;
    letter-spacing:0.03em;
  }
  .guess-count{ color:var(--text-dim); font-size:0.8rem; margin-top:10px; }

  /* Daily-only countdown */
  .countdown{
    margin-top:16px;
    font-family: var(--font-display);
    font-size:0.95rem;
    letter-spacing:0.05em;
    color:var(--accent-2);
    text-align:center;
  }

  /* Endless-only controls */
  .play-again-btn{
    margin-top:20px;
    background:var(--accent-2);
    color:var(--bg);
    border:none;
    border-radius:var(--radius);
    padding:12px 26px;
    font-family: var(--font-display);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    cursor:pointer;
    font-size:0.9rem;
    display:none;
  }
  .play-again-btn:hover{ filter:brightness(1.1); }
  .streak{ margin-top:10px; color:var(--text-dim); font-size:0.85rem; }

  footer{
    margin-top:48px;
    color:var(--text-dim);
    font-size:0.75rem;
    text-align:center;
    max-width:480px;
    line-height:1.6;
  }
</style>

root.setProperty('--portrait-radius', CONFIG.images.shape === 'circle' ? '50%' : CONFIG.layout.radius);
root.setProperty('--portrait-size-board', CONFIG.images.size);
root.setProperty('--portrait-size-dropdown', CONFIG.images.dropdownSize);

// --- Apply text ------------------------------------------------------
document.getElementById('page-title').textContent = CONFIG.meta.title;
document.getElementById('game-title').textContent = CONFIG.meta.title;
document.getElementById('game-subtitle').textContent = CONFIG.meta.subtitle;
document.getElementById('footer-note').textContent = CONFIG.meta.footerNote;
document.getElementById('tab-daily').textContent = CONFIG.meta.tabs.daily;
document.getElementById('tab-endless').textContent = CONFIG.meta.tabs.endless;

// --- Shared helpers ----------------------------------------------------
function initials(name){
  return name.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function makePortrait(entry, sizeClass){
  const wrap = document.createElement('div');
  wrap.className = 'portrait ' + sizeClass;
  if (!CONFIG.images.enabled) { wrap.style.display = 'none'; return wrap; }
  const url = CONFIG.imageOverrides[entry.name];
  if (url) {
    const img = document.createElement('img');
    img.src = url;
    img.alt = entry.name;
    img.onerror = () => { wrap.innerHTML = ''; wrap.textContent = initials(entry.name); };
    wrap.appendChild(img);
  } else {
    wrap.textContent = initials(entry.name);
  }
  return wrap;
}

function makeCell(text, cls){
  const div = document.createElement('div');
  div.className = 'cell ' + cls;
  div.textContent = text;
  return div;
}

const gridTemplate = `1.3fr repeat(${CONFIG.categories.length}, 1fr)`;

function buildHeaderRow(headerRowEl){
  headerRowEl.innerHTML = '';
  const nameHeader = document.createElement('div');
  nameHeader.textContent = "Battlesuit";
  headerRowEl.appendChild(nameHeader);
  CONFIG.categories.forEach(cat => {
    const div = document.createElement('div');
    div.textContent = cat.label;
    headerRowEl.appendChild(div);
  });
  headerRowEl.style.gridTemplateColumns = gridTemplate;
}

// --- Date / countdown helpers (used by Daily mode) ---------------------
function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function msUntilNextMidnight(){
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0);
  return next - now;
}
function formatDuration(ms){
  let totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600); totalSec %= 3600;
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}
function pickDailyAnswer(){
  const today = new Date();
  const seed = today.getFullYear() * 372 + today.getMonth() * 31 + today.getDate();
  return CONFIG.roster[seed % CONFIG.roster.length];
}
function pickRandomAnswer(excludeName){
  const pool = excludeName ? CONFIG.roster.filter(c => c.name !== excludeName) : CONFIG.roster;
  return pool[Math.floor(Math.random() * pool.length)];
}

// --- localStorage for Daily mode (so a refresh doesn't lose progress) --
const DAILY_STORAGE_KEY = 'valkyrindle_daily_v1';
function loadDailyProgress(){
  try {
    const raw = localStorage.getItem(DAILY_STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (data.dateKey !== todayKey()) return null; // stale — new day, ignore it
    return data;
  } catch (e) { return null; }
}
function saveDailyProgress(state){
  try {
    localStorage.setItem(DAILY_STORAGE_KEY, JSON.stringify({
      dateKey: todayKey(),
      guesses: [...state.guessedNames],
      solved: state.solved,
    }));
  } catch (e) { /* localStorage unavailable — game still works, just won't persist */ }
}

// --- Build the DOM for one mode's section (Daily or Endless) -----------
function buildSection(mode){
  const section = document.createElement('div');

  const form = document.createElement('form');
  form.className = 'guess-form';
  form.autocomplete = 'off';
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'guess-input';
  input.placeholder = CONFIG.meta.inputPlaceholder;
  const autocomplete = document.createElement('div');
  autocomplete.className = 'autocomplete';
  const button = document.createElement('button');
  button.type = 'submit';
  button.textContent = 'Guess';
  form.append(input, autocomplete, button);

  const guessCount = document.createElement('div');
  guessCount.className = 'guess-count';

  const boardWrap = document.createElement('div');
  boardWrap.className = 'board-wrap';
  const board = document.createElement('div');
  board.className = 'board';
  const headerRow = document.createElement('div');
  headerRow.className = 'header-row';
  board.appendChild(headerRow);
  boardWrap.appendChild(board);
  buildHeaderRow(headerRow);

  const winBanner = document.createElement('div');
  winBanner.className = 'win-banner';

  section.append(form, guessCount, boardWrap, winBanner);

  const ui = { section, input, autocomplete, form, guessCount, board, headerRow, winBanner };

  if (mode === 'daily') {
    const countdown = document.createElement('div');
    countdown.className = 'countdown';
    section.appendChild(countdown);
    ui.countdown = countdown;
  } else {
    const playAgain = document.createElement('button');
    playAgain.type = 'button';
    playAgain.className = 'play-again-btn';
    playAgain.textContent = 'New Battlesuit →';
    const streak = document.createElement('div');
    streak.className = 'streak';
    streak.textContent = 'Solved: 0';
    section.append(playAgain, streak);
    ui.playAgain = playAgain;
    ui.streak = streak;
  }

  return ui;
}

// --- Wire up guessing behavior for one mode's state ---------------------
function wireSection(state){
  const { ui } = state;

  ui.input.addEventListener('input', () => {
    const q = ui.input.value.trim().toLowerCase();
    ui.autocomplete.innerHTML = '';
    if (!q) { ui.autocomplete.style.display = 'none'; return; }
    const matches = CONFIG.roster.filter(c =>
      c.name.toLowerCase().includes(q) && !state.guessedNames.has(c.name)
    ).slice(0, 6);
    if (matches.length === 0) { ui.autocomplete.style.display = 'none'; return; }
    matches.forEach(c => {
      const item = document.createElement('div');
      item.className = 'autocomplete-item';
      item.appendChild(makePortrait(c, 'portrait-dropdown'));
      const label = document.createElement('span');
      label.textContent = c.name;
      item.appendChild(label);
      item.onclick = () => { ui.input.value = c.name; ui.autocomplete.style.display = 'none'; ui.input.focus(); };
      ui.autocomplete.appendChild(item);
    });
    ui.autocomplete.style.display = 'block';
  });

  ui.form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (state.solved) return;
    const name = ui.input.value.trim();
    const guess = CONFIG.roster.find(c => c.name.toLowerCase() === name.toLowerCase());
    if (!guess) {
      ui.input.style.borderColor = 'var(--danger)';
      setTimeout(() => ui.input.style.borderColor = 'var(--line)', 600);
      return;
    }
    if (state.guessedNames.has(guess.name)) return;
    submitGuess(state, guess);
    ui.input.value = '';
    ui.autocomplete.style.display = 'none';
  });

  if (state.mode === 'endless') {
    ui.playAgain.addEventListener('click', () => startNewEndlessRound(state));
  }
}

function renderRow(state, guess){
  const row = document.createElement('div');
  row.className = 'guess-row';
  row.style.gridTemplateColumns = gridTemplate;

  const nameCell = document.createElement('div');
  nameCell.className = 'cell name ' + (guess.name === state.answer.name ? 'match' : 'no-match');
  nameCell.appendChild(makePortrait(guess, 'portrait-board'));
  const nameLabel = document.createElement('span');
  nameLabel.textContent = guess.name;
  nameCell.appendChild(nameLabel);
  row.appendChild(nameCell);

  CONFIG.categories.forEach(cat => {
    const guessVal = guess[cat.key];
    const answerVal = state.answer[cat.key];
    let cls = 'no-match';
    let text = guessVal;
    if (guessVal === answerVal) {
      cls = 'match';
    } else if (cat.compare === 'ordered' && Array.isArray(cat.order)) {
      const gIdx = cat.order.indexOf(guessVal);
      const aIdx = cat.order.indexOf(answerVal);
      if (gIdx !== -1 && aIdx !== -1) {
        cls = 'close';
        text += gIdx < aIdx ? ' ↑' : ' ↓';
      }
    }
    row.appendChild(makeCell(text, cls));
  });

  state.ui.board.appendChild(row);
}

function submitGuess(state, guess){
  state.guessedNames.add(guess.name);
  state.guessesMade++;
  renderRow(state, guess);

  if (guess.name === state.answer.name) {
    state.solved = true;
    state.ui.winBanner.style.display = 'block';
    state.ui.winBanner.textContent =
      `Correct — it was ${state.answer.name}! Solved in ${state.guessesMade} guess${state.guessesMade > 1 ? 'es' : ''}.`;

    if (state.mode === 'daily') {
      startCountdown(state);
    } else {
      state.streakCount = (state.streakCount || 0) + 1;
      state.ui.streak.textContent = `Solved: ${state.streakCount}`;
      state.ui.playAgain.style.display = 'inline-block';
    }
  }

  state.ui.guessCount.textContent = state.solved ? '' : `Guesses: ${state.guessesMade}`;

  if (state.mode === 'daily') saveDailyProgress(state);
}

// --- Daily-only: live countdown to the next local midnight --------------
function startCountdown(state){
  if (state.countdownTimer) clearInterval(state.countdownTimer);
  const tick = () => {
    const ms = msUntilNextMidnight();
    if (ms <= 0) { clearInterval(state.countdownTimer); location.reload(); return; }
    state.ui.countdown.textContent = `Next battlesuit in ${formatDuration(ms)}`;
  };
  tick();
  state.countdownTimer = setInterval(tick, 1000);
}

// --- Endless-only: start a fresh round without reloading the page -------
function startNewEndlessRound(state){
  state.answer = pickRandomAnswer(state.answer ? state.answer.name : null);
  state.guessesMade = 0;
  state.solved = false;
  state.guessedNames = new Set();
  state.ui.board.innerHTML = '';
  buildHeaderRow(state.ui.headerRow);
  state.ui.board.insertBefore(state.ui.headerRow, state.ui.board.firstChild);
  state.ui.winBanner.style.display = 'none';
  state.ui.guessCount.textContent = '';
  state.ui.playAgain.style.display = 'none';
  state.ui.input.focus();
}

// --- Set up both modes ----------------------------------------------------
const dailyUI = buildSection('daily');
document.getElementById('daily-section').appendChild(dailyUI.section);
const dailyState = { mode: 'daily', ui: dailyUI, answer: pickDailyAnswer(), guessesMade: 0, solved: false, guessedNames: new Set() };
wireSection(dailyState);

// Replay any progress saved earlier today
const saved = loadDailyProgress();
if (saved) {
  saved.guesses.forEach(name => {
    const g = CONFIG.roster.find(r => r.name === name);
    if (g) { dailyState.guessedNames.add(name); dailyState.guessesMade++; renderRow(dailyState, g); }
  });
  dailyState.ui.guessCount.textContent = dailyState.guessesMade ? `Guesses: ${dailyState.guessesMade}` : '';
  if (saved.solved) {
    dailyState.solved = true;
    dailyState.ui.winBanner.style.display = 'block';
    dailyState.ui.winBanner.textContent = `Correct — it was ${dailyState.answer.name}! Solved in ${dailyState.guessesMade} guess${dailyState.guessesMade > 1 ? 'es' : ''}.`;
    startCountdown(dailyState);
    dailyState.ui.guessCount.textContent = '';
  }
}

const endlessUI = buildSection('endless');
document.getElementById('endless-section').appendChild(endlessUI.section);
const endlessState = { mode: 'endless', ui: endlessUI, answer: pickRandomAnswer(), guessesMade: 0, solved: false, guessedNames: new Set(), streakCount: 0 };
wireSection(endlessState);

// --- Tab switching ----------------------------------------------------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const mode = btn.dataset.mode;
    document.getElementById('daily-section').style.display = mode === 'daily' ? 'flex' : 'none';
    document.getElementById('endless-section').style.display = mode === 'endless' ? 'flex' : 'none';
  });
});

// --- Close any open autocomplete dropdown when clicking elsewhere ------
document.addEventListener('click', (e) => {
  document.querySelectorAll('.guess-form').forEach(form => {
    if (!form.contains(e.target)) {
      const ac = form.querySelector('.autocomplete');
      if (ac) ac.style.display = 'none';
    }
  });
});
</script>
